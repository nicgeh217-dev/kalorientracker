<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fc4c02">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/barlow-condensed-800i.woff2" as="font" type="font/woff2" crossorigin>
  <title>Kalorientracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section id="view-today"></section>
    <section id="view-products" hidden></section>
    <section id="view-weight" hidden></section>
    <section id="view-settings" hidden></section>
  </main>
  <div id="dialog-root"></div>
  <nav id="nav">
    <button data-view="today">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.2"/></svg>Heute
    </button>
    <button data-view="products">
      <svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>Produkte
    </button>
    <button id="fab" aria-label="Foto scannen">
      <svg viewBox="0 0 24 24"><path d="M4 8.5h3l1.5-2h7l1.5 2h3V19H4z"/><circle cx="12" cy="13.5" r="3.6"/></svg>
    </button>
    <button data-view="weight">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4.5"/><path d="M8.3 9.6a5 5 0 0 1 7.4 0"/><path d="M12 13.2l2-2.7"/></svg>Gewicht
    </button>
    <button data-view="settings">
      <svg viewBox="0 0 24 24"><path d="M4 8h9M17 8h3M4 16h3M11 16h9"/><circle cx="15" cy="8" r="2"/><circle cx="9" cy="16" r="2"/></svg>Einstellungen
    </button>
  </nav>
  <script type="module" src="src/app.js"></script>
</body>
</html>
