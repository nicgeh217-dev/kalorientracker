<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2711c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/barlow-condensed-800i.woff2" as="font" type="font/woff2" crossorigin>
  <title>Kalorientracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="splash" aria-hidden="true" style="position:fixed;inset:0;z-index:100;background:#0e0e10"></div>
  <script>
    // Spart den Splash sofort, wenn er nicht laufen soll (kein Aufblitzen). Die endgültige Entscheidung trifft src/app.js.
    (function () {
      try {
        var nav = performance.getEntriesByType('navigation')[0];
        var skip = sessionStorage.getItem('splashShown') === '1' || /[?&]action=/.test(location.search)
          || (nav && nav.type === 'reload') || matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (skip) document.getElementById('splash').remove();
      } catch (e) { /* Splash darf laufen */ }
    })();
  </script>
  <main>
    <section id="view-today"></section>
    <section id="view-training" hidden></section>
    <section id="view-history" hidden></section>
    <section id="view-products" hidden></section>
    <section id="view-weight" hidden></section>
    <section id="view-more" hidden></section>
    <section id="view-settings" hidden></section>
  </main>
  <div id="dialog-root"></div>
  <nav id="nav">
    <button data-view="today">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.2"/></svg>Heute
    </button>
    <button data-view="training">
      <svg viewBox="0 0 24 24"><path d="M3.5 9.5v5M6.5 7v10M17.5 7v10M20.5 9.5v5M6.5 12h11"/></svg>Training
    </button>
    <button id="fab" aria-label="Eintragen">
      <svg viewBox="0 0 24 24"><path d="M4 8.5h3l1.5-2h7l1.5 2h3V19H4z"/><circle cx="12" cy="13.5" r="3.6"/></svg>
    </button>
    <button data-view="history">
      <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3.5"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Verlauf
    </button>
    <button data-view="more">
      <svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/></svg>Mehr
    </button>
  </nav>
  <script type="module" src="src/app.js"></script>
</body>
</html>
