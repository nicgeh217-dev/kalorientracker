name: Android-APK bauen

on:
  push:
    branches: [native]
  workflow_dispatch:

# Pushes kurz hintereinander laufen nacheinander, damit die neuere Version zuletzt veröffentlicht wird und "latest" bleibt.
concurrency:
  group: apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # für die Veröffentlichung als Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Tests (ein roter Test stoppt den Bau)
        run: npm test
      - run: npm ci
      - name: Web-App in den App-Ordner kopieren und mit Capacitor abgleichen
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          node scripts/build-web.mjs
          npx cap sync android
      - name: Android-Lizenzen akzeptieren
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Festen Debug-Schlüssel aus dem Secret holen
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug-fest.p12"
            echo "DEBUG_KEYSTORE_FILE=$RUNNER_TEMP/debug-fest.p12" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "push" ]; then
            # Ohne den festen Schlüssel würde ein zufällig signierter APK veröffentlicht, den Android nicht über die installierte App lässt.
            echo "::error::Das Secret DEBUG_KEYSTORE_B64 fehlt. Es wird nichts veröffentlicht."
            exit 1
          fi
      - name: Debug-APK bauen
        working-directory: android
        env:
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: kalorientracker-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Als Release veröffentlichen (für den Update-Hinweis in der App)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Kalorientracker.apk
          TAG="app-${{ github.run_number }}"
          # Ein erneuter Lauf derselben Nummer (Re-run) darf nicht scheitern, weil das Release schon da ist.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG gibt es schon, nichts zu tun."
          else
            gh release create "$TAG" Kalorientracker.apk --target "$GITHUB_SHA" --title "Version ${{ github.run_number }}" --notes "$(git log -1 --pretty=%s)" --latest
          fi
