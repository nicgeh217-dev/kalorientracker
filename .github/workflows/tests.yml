name: Tests

# Bei jedem Push und jeder Pull Request: alle Tests laufen lassen, bevor etwas gebaut oder veröffentlicht wird.
# Die Tests brauchen keine Pakete (eingebauter Node-Testrunner), darum gibt es kein npm ci.
on:
  push:
    branches: [main, native]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
